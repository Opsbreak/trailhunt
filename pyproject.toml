[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trailhunt"
dynamic = ["version"]
description = "Offline AWS CloudTrail threat hunting and detection engine with stateful correlation (match, threshold, sequence and first-seen rules)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Opsbreak Inc." }]
keywords = ["aws", "cloudtrail", "security", "threat-hunting", "detection", "dfir", "siem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
trailhunt = "trailhunt.cli:main"

[project.urls]
Homepage = "https://github.com/Opsbreak/trailhunt"
Issues = "https://github.com/Opsbreak/trailhunt/issues"
Changelog = "https://github.com/Opsbreak/trailhunt/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/trailhunt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trailhunt"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples/*.py", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE"]
ignore = ["SIM108", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# literal user-agent strings and event payloads in the synthetic data generator
"examples/*" = ["E501"]
